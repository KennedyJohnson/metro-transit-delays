name: Daily forecast

# 09:15 UTC = 4:15 am CDT / 3:15 am CST, before the morning rush.
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Route names from the static GTFS
        run: mkdir -p data/gtfs && curl -sfL -o data/gtfs/gtfs.zip https://svc.metrotransit.org/mtgtfs/gtfs.zip || true
      - name: Compress finished days
        run: find data/raw -name '*.csv' ! -name "$(TZ=America/Chicago date +%F).csv" -exec gzip -f {} \;
      - run: python -m pytest -q tests
      - run: python model/forecast.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/forecasts docs/data
          git diff --staged --quiet && exit 0
          git commit -q -m "forecast: daily update [automated]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1

  alert-on-failure:
    needs: forecast
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Daily forecast failed (${new Date().toISOString().slice(0,10)})`,
              body: `The site is showing yesterday's forecast, or the collector has stopped.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['stale-data'],
            });
