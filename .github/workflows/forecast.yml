name: Daily forecast

# 09:15 UTC = 4:15 am CDT / 3:15 am CST, before the morning rush. Also refreshes schedules from the static GTFS.
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAW_DIR: ${{ github.workspace }}/store
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: data
          path: store
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Compress finished days, drop days past the retention window
        run: python collector/trim.py
      - run: python -m pytest -q tests
      - run: python model/train.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet && exit 0
          git commit -q -m "forecast: daily update [automated]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep $((i * 5)); done
          exit 1
      # Replace the data branch's history with one commit holding just the retained days, so old snapshots and
      # the collector's 96 commits a day don't pile up. The lease retries if the collector pushed meanwhile.
      - name: Squash the data branch
        if: always()
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q --depth 1 origin data
            git checkout -q -f -B work origin/data
            git branch -q -D snap 2>/dev/null || true
            python ../collector/trim.py
            git checkout -q --orphan snap
            git add -A
            git commit -q -m "data: raw snapshots, retained days [automated]"
            git push -q --force-with-lease="data:$(git rev-parse origin/data)" origin snap:data && exit 0
            sleep 20
          done
          exit 1

  alert-on-failure:
    needs: forecast
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Daily forecast failed (${new Date().toISOString().slice(0,10)})`,
              body: `Predictions and schedules on the site are going stale, or the collector has stopped.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['stale-data'],
            });

  # GitHub disables cron workflows after 60 days without repo activity. The collector restarts
  # itself and commits constantly, but re-enable both crons daily in case that chain ever stops.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: |
          for wf in collect.yml forecast.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
        env:
          GH_TOKEN: ${{ github.token }}
