name: Collect

# Every 15 minutes: snapshot how late each active trip is. GitHub may delay or skip
# scheduled runs under load; the model only needs a sample of each hour.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install gtfs-realtime-bindings requests pandas pyarrow
      # static schedule, only needed when the feed omits delays; one cache per day
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/gtfs
          key: gtfs-${{ steps.day.outputs.day }}
          restore-keys: gtfs-
      - run: python collector/collect.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --staged --quiet && exit 0
          git commit -q -m "data: snapshot [automated]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
