name: Collect

# One run polls the live feed every 15 minutes for ~5.5 hours, committing each snapshot, then starts
# the next run itself (workflow_dispatch from GITHUB_TOKEN is allowed to trigger runs). This doesn't
# rely on GitHub's cron, which can be delayed or skipped for 15-minute schedules; the 6-hourly cron
# only restarts the chain if it ever breaks.
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      POLLS: 22          # 22 x 15 min = 5.5 h
      INTERVAL: 900
      RAW_DIR: ${{ github.workspace }}/store
    steps:
      - uses: actions/checkout@v7
      # raw snapshots live on the `data` branch, which the daily job squashes to one commit so the repo stays small
      - uses: actions/checkout@v7
        with:
          ref: data
          path: store
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install gtfs-realtime-bindings requests pandas pyarrow
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # static schedule, reused across polls; one cache per day
      - uses: actions/cache@v6
        with:
          path: data/gtfs
          key: gtfs-${{ steps.day.outputs.day }}
          restore-keys: gtfs-
      - name: Poll every 15 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C store config user.name "github-actions[bot]"
          git -C store config user.email "github-actions[bot]@users.noreply.github.com"
          # Each poll starts from the branch as it is now (the daily job may have squashed it), appends, pushes.
          # If the push races that job, re-poll on the fresh branch.
          snapshot() {
            git -C store fetch -q --depth 1 origin data && git -C store reset -q --hard origin/data || return 1
            python collector/collect.py || { echo "::warning::poll $i failed"; return 0; }
            git -C store add -A
            git -C store diff --cached --quiet && return 0
            git -C store commit -q -m "data: snapshot [automated]"
            git -C store push -q origin HEAD:data
          }
          for i in $(seq 1 "$POLLS"); do
            start=$(date +%s)
            for try in 1 2 3; do snapshot && break; sleep 20; done
            # GitHub's cron hasn't been firing for this repo, so the collector also starts the daily
            # training job once per UTC day after 09:00 if it hasn't run yet
            if [ "$(date -u +%H)" -ge 9 ] && [ "$(gh run list --workflow forecast.yml --created ">=$(date -u +%F)" --json databaseId -q length)" = "0" ]; then
              gh workflow run forecast.yml --ref main && echo "started today's forecast"
            fi
            if [ "$i" -lt "$POLLS" ]; then sleep $(( INTERVAL - ($(date +%s) - start) % INTERVAL )); fi
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main
