name: Collect

# One run polls the live feed every 15 minutes for ~5.5 hours, committing each snapshot, then starts
# the next run itself (workflow_dispatch from GITHUB_TOKEN is allowed to trigger runs). This doesn't
# rely on GitHub's cron, which can be delayed or skipped for 15-minute schedules; the 6-hourly cron
# only restarts the chain if it ever breaks.
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      POLLS: 22          # 22 x 15 min = 5.5 h
      INTERVAL: 900
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install gtfs-realtime-bindings requests pandas pyarrow
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # static schedule, reused across polls; one cache per day
      - uses: actions/cache@v4
        with:
          path: data/gtfs
          key: gtfs-${{ steps.day.outputs.day }}
          restore-keys: gtfs-
      - name: Poll every 15 minutes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 "$POLLS"); do
            start=$(date +%s)
            python collector/collect.py || echo "::warning::poll $i failed"
            git add data/raw
            if ! git diff --staged --quiet; then
              git commit -q -m "data: snapshot [automated]"
              for try in 1 2 3; do git pull -q --rebase && git push -q && break; sleep $((try * 5)); done
            fi
            if [ "$i" -lt "$POLLS" ]; then sleep $(( INTERVAL - ($(date +%s) - start) % INTERVAL )); fi
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main
